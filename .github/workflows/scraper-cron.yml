name: Scraper Cron Job

# Run every 15 minutes
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.12'

jobs:
  run-scrapers:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        working-directory: ./backend
        run: |
          playwright install chromium

      - name: Run scrapers
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: production
        run: |
          python -m waittime.cli.scraper --all

      - name: Check scraper health
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Query scraper_status table for failures
          # This could trigger alerts if multiple failures detected
          echo "Scraper run failed - check logs"

      - name: Send Pushover alert on failure
        if: failure()
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          curl -s \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=🚨 Scraper Failure" \
            --form-string "message=Scraper cron job failed. View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
