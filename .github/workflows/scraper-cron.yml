name: Scraper Cron Job

# Run every 15 minutes
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.12'

jobs:
  run-scrapers:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run scrapers
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: production
        run: |
          python -m waittime.cli.scraper --all

      - name: Check scraper health
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Query scraper_status table for failures
          # This could trigger alerts if multiple failures detected
          echo "Scraper run failed - check logs"

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: '[WaitTime Canada] Scraper Failure Alert'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: WaitTime Canada Monitoring
          body: |
            Scraper cron job failed at ${{ github.run_id }}.

            View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This is an automated alert from the Dead Man's Switch.
