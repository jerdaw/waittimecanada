name: Database Cleanup

# Keep manual dispatch available for an operator-run retention cleanup while
# scheduled jobs remain paused. The delete path is intentionally batched so a
# single maintenance run stays bounded and observable.
on:
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: database-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e .

      - name: Run database cleanup
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.cleanup --verbose --skip-aggregate-refresh --delete-batch-size 5000 --max-delete-batches 20

      - name: Report measurement storage footprint
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.storage_stats --relation measurements

      - name: Report cleanup results
        if: success()
        run: |
          echo "✅ Database cleanup completed successfully"
          echo "Aggregate refresh was skipped to keep the maintenance window bounded"
          echo "Old measurements (>30 days) were deleted in bounded batches"
          echo "Measurement table storage stats were reported"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Database cleanup failed!"
          echo "Manual investigation required"
