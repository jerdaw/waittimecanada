site_name: Wait Time Canada
site_url: https://jerdaw.github.io/waittimecanada
site_description: A clinically defensible Health Systems Observatory for Canadian ER wait times
site_author: Jeremy Dawson
repo_url: https://github.com/jerdaw/waittimecanada
repo_name: waittimecanada
strict: true
edit_uri: edit/main/docs/
exclude_docs: |
  # Keep repo-readable indexes, but avoid MkDocs strict-mode warnings.
  README.md

  # Historical snapshots (retain in repo, exclude from site build).
  REPO_STRUCTURE_PLAN.md
  final-documentation-review.md

  # Archived planning/implementation artifacts are retained for context only.
  planning/archive/*
  planning/implementation/archived/*
  implementation/*

  # Non-site planning artifacts (retain in repo, exclude from site build).
  planning/competitor-design-analysis.md
  planning/deployment-blockers.md
  planning/expansion-roadmap.md
  planning/scraper-status-2026-02-04.md
  planning/strategic-plan.md
  planning/ux-seo-implementation-plan.md

  # Templates should not fail strict builds.
  adr/template.md

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      lang: en

  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YOUR_USERNAME
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/YOUR_PROFILE

nav:
  - Home: index.md

  - Getting Started:
    - getting-started/index.md
    - Quick Start: getting-started/quick-start.md

  - Architecture:
    - architecture/index.md
    - Data Flow: architecture/data-flow.md
    - Database: architecture/database.md
    - API Architecture: architecture/api.md

  - API:
    - Reference: API.md
    - OpenAPI Spec: openapi.yaml

  - Operations:
    - operations/QUICK_START.md
    - operations/OPERATIONAL_STATUS.md
    - operations/scraper-scheduling.md
    - operations/zenodo-integration.md
    - Production Deployment Plan: production-deployment-plan.md

  - Development:
    - development/setup.md
    - Database Migrations: development/database-migrations.md
    - Testing Guidelines: development/testing-guidelines.md
    - Documentation Guidelines: development/documentation-guidelines.md

  - Reference:
    - Data Dictionary: reference/data-dictionary.md
    - Environment Variables: reference/environment-variables.md

  - ADRs:
    - adr/index.md
    - "0002: Metric Ontology": adr/0002-metric-ontology.md
    - "0006: Dead Man's Switch Monitoring": adr/0006-dead-mans-switch-monitoring.md
    - "0007: BC Scraper Implementation": adr/0007-bc-scraper-implementation.md
    - "0008: Aggregation Pipeline": adr/0008-aggregation-pipeline.md
    - "0009: Data Quality & Anomaly Detection": adr/0009-data-quality-anomaly-detection.md
    - "0016: Equity Academic Rigor Hardening": adr/0016-equity-academic-rigor-hardening-ontario.md
    - "0017: Domain Rebrand (wait-time.ca)": adr/0017-domain-rebrand-wait-time-ca.md

  - Planning:
    - planning/roadmap.md
    - planning/index.md
    - planning/roadmap-process.md
    - planning/manual-tasks.md
    - Maintenance 2026-02-13: planning/maintenance-2026-02-13.md
    - Maintenance 2026-02-19: planning/maintenance-2026-02-19.md

