[project]
name = "waittime"
version = "0.1.0"
description = "Provincial ER wait time scrapers for Wait Time Canada"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "defusedxml>=0.7.1",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "playwright>=1.40.0",
]

[project.scripts]
scraper = "waittime.cli.scraper:main"
check_heartbeat = "waittime.cli.check_heartbeat:main"
aggregate = "waittime.cli.aggregate:main"
database_cleanup = "waittime.cli.cleanup:main"
export_json = "waittime.cli.export_json:main"
populate_seed_data = "waittime.cli.populate_seed_data:main"
snapshot_quality = "waittime.cli.snapshot_quality:main"
storage_stats = "waittime.cli.storage_stats:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
    "types-psycopg2>=2.9.0",
    "hypothesis>=6.0.0",
]
equity = [
    "geopandas>=1.0.0",
    "pyogrio>=0.10.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["E501"]  # Line too long (formatter handles this)

[tool.ruff.lint.per-file-ignores]
"src/waittime/cli/*.py" = ["T201"]  # Allow print in CLI tools
"tests/**/*.py" = ["S101"]  # Allow assert in pytest tests
"tests/unit/test_geocoding.py" = ["S101", "S106"]  # Allow test tokens
"tests/unit/services/test_alert_service.py" = ["S101", "S105", "S106"]  # Allow test tokens
"scripts/*.py" = ["T201"]  # Allow print in scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = false  # Use overrides for specific libs
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_unreachable = true
allow_untyped_calls = false
allow_untyped_defs = false
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = [
    "psycopg2.*",
    "tenacity.*",
    "playwright.*",
    "requests.*",
    "bs4.*",
    "defusedxml",
    "defusedxml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]
markers = [
    "unit: Fast tests with no I/O",
    "integration: Tests with database or HTTP",
    "e2e: End-to-end workflow tests",
    "slow: Tests that take longer to run",
]
