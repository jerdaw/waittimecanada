[project]
name = "waittime"
version = "0.1.0"
description = "Provincial ER wait time scrapers for WaitTime Canada"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
    "types-psycopg2>=2.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["E501"]  # Line too long (formatter handles this)

[tool.ruff.lint.per-file-ignores]
"src/waittime/cli/*.py" = ["T201"]  # Allow print in CLI tools
"tests/**/*.py" = ["S101"]  # Allow assert in pytest tests
"tests/unit/test_geocoding.py" = ["S101", "S106"]  # Allow test tokens

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Pragmatic type checking - catch actual bugs without being pedantic
strict = false
warn_return_any = false  # Too noisy with external libs
warn_unused_configs = true
disallow_untyped_defs = false  # Allow gradual typing
disallow_any_generics = false  # Allow dict without type params
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Don't fail on unused ignores
ignore_missing_imports = true  # Ignore stubs for external libs
disallow_untyped_calls = false  # Don't require all dependencies to be typed
disallow_incomplete_defs = true  # Catch partially typed functions
warn_unreachable = true  # Catch dead code
allow_untyped_calls = true  # Allow calls to untyped functions
allow_untyped_defs = true  # Allow untyped function definitions
disallow_untyped_decorators = false  # Allow untyped decorators

[[tool.mypy.overrides]]
module = [
    "psycopg2.*",
    "tenacity.*",
    "playwright.*",
    "requests.*",
    "bs4.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src/waittime",
    "--cov-report=term-missing",
]
markers = [
    "unit: Fast tests with no I/O",
    "integration: Tests with database or HTTP",
    "e2e: End-to-end workflow tests",
    "slow: Tests that take longer to run",
]
