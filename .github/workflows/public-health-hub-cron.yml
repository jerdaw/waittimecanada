name: Public Health Hub Ingest

on:
  # Scheduled trigger paused to conserve GitHub Actions free-tier minutes.
  # Use workflow_dispatch until the scheduled cadence is restored.
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: public-health-hub-cron
  cancel-in-progress: false

jobs:
  ingest-public-health-hub:
    name: Ingest Public Health Hub Sources
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ingest live MOHSERLO resources
        id: ingest_mohserlo
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.seed_public_health_resources \
            --fetch-mohserlo-live

      - name: Ingest live ODHF resources
        id: ingest_odhf
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.seed_public_health_resources \
            --fetch-odhf-live

      - name: Ingest live OSM AED fallback
        id: ingest_aed
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          output="$(python -m waittime.cli.seed_public_health_resources \
            --fetch-osm-aed-live 2>&1)"
          exit_code=$?

          echo "$output"

          if [ "$exit_code" -eq 0 ]; then
            {
              echo "status=success"
              echo "message=Live OSM AED fallback refresh succeeded."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "status=best_effort_failed"
            echo "message=Best-effort OSM AED fallback refresh failed for this run; retained existing AED dataset state."
          } >> "$GITHUB_OUTPUT"

          echo "Best-effort OSM AED fallback refresh failed for this run; retained existing AED dataset state."
          exit 0

      - name: Ingest live public health alerts
        id: ingest_alerts
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.seed_public_health_alerts --fetch-live

      - name: Ingest Ontario EMS system context
        id: ingest_system_context
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.seed_public_health_system_context --fetch-live

      - name: Write ingest step summary
        if: always()
        run: |
          {
            echo "## Public Health Hub Ingest"
            echo
            echo "- MOHSERLO: ${{ steps.ingest_mohserlo.outcome }}"
            echo "- ODHF: ${{ steps.ingest_odhf.outcome }}"
            echo "- OSM AED fallback: ${{ steps.ingest_aed.outputs.status }}"
            echo "- Health Canada alerts: ${{ steps.ingest_alerts.outcome }}"
            echo "- Ontario EMS system context: ${{ steps.ingest_system_context.outcome }}"
            echo
            if [ "${{ steps.ingest_aed.outputs.status }}" = "best_effort_failed" ]; then
              echo "_Best-effort AED refresh failed for this run. Existing AED dataset state was retained, and paging remains disabled for this source._"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write source status summary
        if: always()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.public_health_hub_status \
            --source mohserlo \
            --source odhf \
            --source osm-aed \
            --source health-canada-recalls \
            --source ontario-land-ambulance-response-times \
            --format markdown | tee -a "$GITHUB_STEP_SUMMARY" || {
            echo "_Public health hub status summary unavailable for this run._" >> "$GITHUB_STEP_SUMMARY"
          }

      - name: Check transition-aware public health ingest alerts
        if: always()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_API_URL: ${{ secrets.ALERT_API_URL }}
          ALERT_USER_KEY: ${{ secrets.ALERT_USER_KEY }}
          ALERT_API_TOKEN: ${{ secrets.ALERT_API_TOKEN }}
        run: |
          python -m waittime.cli.check_public_health_hub_ingest --verbose
