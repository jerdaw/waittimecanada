name: Heartbeat Monitor (Dead Man's Switch)

# Monitor between hourly scraper runs and page only on classified critical
# failures.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: heartbeat-monitor
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.23"

jobs:
  check-heartbeat:
    name: Check Scraper Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --no-dev

      - name: Check heartbeats
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_API_URL: ${{ secrets.ALERT_API_URL }}
          ALERT_USER_KEY: ${{ secrets.ALERT_USER_KEY }}
          ALERT_API_TOKEN: ${{ secrets.ALERT_API_TOKEN }}
          OPERATIONAL_NOTIFICATION_MODE: critical_only
        run: |
          uv run python -m waittime.cli.check_heartbeat --max-age 120 --max-consecutive-failures 1
