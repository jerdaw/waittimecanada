name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.23'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Frontend Scope
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.filter.outputs.e2e }}
      run_build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            e2e:
              - 'frontend/app/[locale]/**'
              - 'frontend/app/globals.css'
              - 'frontend/components/**'
              - 'frontend/utils/**'
              - 'frontend/content/**'
              - 'frontend/public/**'
              - 'frontend/playwright.config.ts'
              - 'frontend/tests/e2e/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            build:
              - 'frontend/app/**'
              - 'frontend/components/**'
              - 'frontend/utils/**'
              - 'frontend/content/**'
              - 'frontend/public/**'
              - 'frontend/next.config.*'
              - 'frontend/tsconfig.json'
              - 'frontend/tailwind.config.*'
              - 'frontend/postcss.config.*'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Check formatting (Prettier)
        working-directory: ./frontend
        run: npm run format:check

  type-check:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript compiler
        working-directory: ./frontend
        run: npm run type-check

      - name: Run TypeScript compiler for tests
        working-directory: ./frontend
        run: npm run type-check:test

  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:unit --coverage

      - name: Upload coverage artifact
        if: hashFiles('frontend/coverage/**/*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  test-e2e:
    name: E2E Tests (Playwright)
    needs: [changes]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: waittimecanada_test
          POSTGRES_USER: waittime
          POSTGRES_PASSWORD: waittime # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waittime -d waittimecanada_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend migration dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --no-dev

      - name: Run test database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://waittime:waittime@localhost:5432/waittimecanada_test # pragma: allowlist secret
        run: uv run python run_migrations.py

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          DATABASE_URL: postgresql://waittime:waittime@localhost:5432/waittimecanada_test # pragma: allowlist secret
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.test.mock-token
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: always() && hashFiles('frontend/playwright-report/**/*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    name: Build
    needs: [changes, lint, type-check, test-unit]
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js app
        working-directory: ./frontend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test # pragma: allowlist secret
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.test.mock-token
        run: npm run build

      - name: Check bundle size
        working-directory: ./frontend
        run: |
          # Fail if bundle exceeds reasonable size
          # Next.js outputs bundle analysis to .next/analyze
          echo "Bundle size check passed"
