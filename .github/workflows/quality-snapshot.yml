name: Daily Quality Snapshot
# PAUSED (2026-02-22): Scheduled runs disabled due to exhausted GitHub Actions quota.
# Keep manual dispatch available for one-off snapshots.
on:
  workflow_dispatch:

jobs:
  quality-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ./backend
      - name: Run daily quality snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m waittime.cli.snapshot_quality
      - name: Run drift check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/monitor_drift.py || true
