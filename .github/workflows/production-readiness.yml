name: Production Readiness

on:
  workflow_dispatch:
    inputs:
      heartbeat_max_age_minutes:
        description: "Maximum allowed scraper heartbeat age in minutes"
        required: false
        default: "120"
        type: string
      run_smoke_check:
        description: "Run production smoke check in this workflow"
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Validate Production Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate required/recommended secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_API_URL: ${{ secrets.ALERT_API_URL }}
          ALERT_USER_KEY: ${{ secrets.ALERT_USER_KEY }}
          ALERT_API_TOKEN: ${{ secrets.ALERT_API_TOKEN }}
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          missing_required=0

          if [ -z "${DATABASE_URL}" ]; then
            echo "ERROR: DATABASE_URL is missing."
            missing_required=1
          else
            echo "OK: DATABASE_URL is configured."
          fi

          if [ -z "${ALERT_API_URL}" ] || [ -z "${ALERT_USER_KEY}" ] || [ -z "${ALERT_API_TOKEN}" ]; then
            echo "WARN: Alert provider secrets are not fully configured (optional)."
          else
            echo "OK: Alert provider secrets are configured."
          fi

          if [ -z "${PRODUCTION_BASE_URL}" ]; then
            echo "WARN: PRODUCTION_BASE_URL is not configured (required for smoke automation)."
          else
            echo "OK: PRODUCTION_BASE_URL is configured."
          fi

          if [ "${missing_required}" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify scraper heartbeat freshness
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.check_heartbeat \
            --max-age "${{ inputs.heartbeat_max_age_minutes }}" \
            --dry-run

      - name: Run production smoke checks
        if: ${{ inputs.run_smoke_check }}
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          if [ -z "${PRODUCTION_BASE_URL}" ]; then
            echo "Skipping smoke check: PRODUCTION_BASE_URL is not configured."
            exit 0
          fi
          set -o pipefail
          bash ./scripts/production-smoke.sh | tee smoke-output.txt

      - name: Write production smoke summary
        if: ${{ always() && inputs.run_smoke_check }}
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          {
            echo "## Production Smoke"
            echo
            if [ -z "${PRODUCTION_BASE_URL}" ]; then
              echo "_Skipped: PRODUCTION_BASE_URL is not configured._"
            elif [ -f smoke-output.txt ]; then
              echo "Base URL: ${PRODUCTION_BASE_URL}"
              echo
              echo '```text'
              cat smoke-output.txt
              echo '```'
            else
              echo "_Smoke output unavailable for this run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
