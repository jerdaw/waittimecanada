comment: false

coverage:
  status:
    default_rules:
      # Frontend and backend upload from separate path-scoped workflows.
      # Skip component statuses when that surface did not upload on this PR.
      flag_coverage_not_uploaded_behavior: exclude
    project:
      default: false
      frontend:
        flags:
          - frontend
        target: auto
        threshold: 1%
        informational: true
        only_pulls: true
      backend:
        flags:
          - scrapers
        target: auto
        threshold: 1%
        informational: true
        only_pulls: true
    patch:
      default:
        target: 80%
        threshold: 0%
        only_pulls: true

flags:
  frontend:
    paths:
      - frontend/
    carryforward: true
  scrapers:
    paths:
      - backend/
    carryforward: true
