name: Heartbeat Monitor (Dead Man's Switch)

# Monitor between hourly scraper runs and page only on classified critical
# failures. Stagger checks away from common :00/:30 schedule boundaries.
on:
  schedule:
    - cron: "14,44 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: heartbeat-monitor
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.23"

jobs:
  check-heartbeat:
    name: Check Scraper Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --no-dev

      - name: Check heartbeats
        id: check_heartbeats
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_API_URL: ${{ secrets.ALERT_API_URL }}
          ALERT_USER_KEY: ${{ secrets.ALERT_USER_KEY }}
          ALERT_API_TOKEN: ${{ secrets.ALERT_API_TOKEN }}
          OPERATIONAL_NOTIFICATION_MODE: critical_only
        run: |
          uv run python -m waittime.cli.check_heartbeat --max-age 120 --max-consecutive-failures 1

      - name: Dispatch freshness-only scraper recovery
        if: ${{ failure() && steps.check_heartbeats.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          in_progress_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Scraper Cron Job" \
            --status in_progress \
            --json databaseId \
            --jq 'length')"
          queued_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Scraper Cron Job" \
            --status queued \
            --json databaseId \
            --jq 'length')"

          if [ "$in_progress_runs" != "0" ] || [ "$queued_runs" != "0" ]; then
            echo "Scraper workflow already queued or running; skipping recovery dispatch."
            exit 0
          fi

          gh workflow run scraper-cron.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f refresh_analytics=false
