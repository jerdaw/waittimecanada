name: Scraper Cron Job

# Keep public source status aligned with hourly collection and a 120-minute
# freshness threshold. Run away from the top of the hour to reduce GitHub
# scheduled-workflow delay/drop risk.
on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:
    inputs:
      refresh_analytics:
        description: "Run post-scrape daily analytics aggregate refresh"
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.23"

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  run-scrapers:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --no-dev

      - name: Install Playwright browsers
        working-directory: ./backend
        run: |
          uv run playwright install chromium

      - name: Run scrapers
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: production
        run: |
          uv run python -m waittime.cli.scraper --all

      - name: Summarize scraper operational status
        if: always()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m waittime.cli.check_heartbeat --max-age 120 --max-consecutive-failures 1 --dry-run --verbose || true

      - name: Generate Freshness Badge
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: ./backend
        run: |
          uv run python scripts/generate_freshness_badge.py freshness.json
          cat freshness.json

      - name: Upload Badge Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: freshness-badge
          path: backend/freshness.json
          retention-days: 1

      - name: Refresh current analytics aggregates
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_analytics }}
        timeout-minutes: 15
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m waittime.cli.aggregate --incremental --period daily

      - name: Send classified scraper alerts on failure
        if: failure()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_API_URL: ${{ secrets.ALERT_API_URL }}
          ALERT_USER_KEY: ${{ secrets.ALERT_USER_KEY }}
          ALERT_API_TOKEN: ${{ secrets.ALERT_API_TOKEN }}
          OPERATIONAL_NOTIFICATION_MODE: critical_only
        run: |
          uv run python -m waittime.cli.check_heartbeat --max-age 120 --max-consecutive-failures 1 || true
