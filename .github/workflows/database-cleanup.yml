name: Database Maintenance

# Keep manual dispatch available for lightweight storage reporting and
# explicit operator-approved purge work.
on:
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: database-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e .

      - name: Run database maintenance
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.cleanup

      - name: Report measurement storage footprint
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.storage_stats --relation measurements

      - name: Report maintenance results
        if: success()
        run: |
          echo "✅ Database maintenance completed successfully"
          echo "No aggregate recomputation was performed"
          echo "Raw measurements were preserved unless an explicit purge flag was supplied"
          echo "Measurement table storage stats were reported"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Database maintenance failed!"
          echo "Manual investigation required"
