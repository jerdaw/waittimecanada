name: Docs CI

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sh"
      - "**/*.sql"
      - "**/*.css"
      - "**/*.html"
      - "**/*.csv"
      - "**/*.toml"
      - "**/*.ini"
      - "**/*.cfg"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sh"
      - "**/*.sql"
      - "**/*.css"
      - "**/*.html"
      - "**/*.csv"
      - "**/*.toml"
      - "**/*.ini"
      - "**/*.cfg"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Run docs quality checks
        run: bash scripts/check-docs.sh
