name: Scraper Cron Job

# Scheduled trigger paused to conserve GitHub Actions free-tier minutes.
# Use workflow_dispatch until the scheduled cadence is restored.
on:
  workflow_dispatch: # Allow manual trigger

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.23"

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  run-scrapers:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --no-dev

      - name: Install Playwright browsers
        working-directory: ./backend
        run: |
          uv run playwright install chromium

      - name: Run scrapers
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: production
        run: |
          uv run python -m waittime.cli.scraper --all

      - name: Refresh current analytics aggregates
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m waittime.cli.aggregate --incremental

      - name: Summarize scraper operational status
        if: always()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m waittime.cli.check_heartbeat --max-age 120 --dry-run --verbose || true

      - name: Generate Freshness Badge
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: ./backend
        run: |
          uv run python scripts/generate_freshness_badge.py freshness.json
          cat freshness.json

      - name: Upload Badge Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: freshness-badge
          path: backend/freshness.json
          retention-days: 1

      - name: Send classified scraper alerts on failure
        if: failure()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_API_URL: ${{ secrets.ALERT_API_URL }}
          ALERT_USER_KEY: ${{ secrets.ALERT_USER_KEY }}
          ALERT_API_TOKEN: ${{ secrets.ALERT_API_TOKEN }}
        run: |
          uv run python -m waittime.cli.check_heartbeat --max-age 120 --max-consecutive-failures 1 || true
