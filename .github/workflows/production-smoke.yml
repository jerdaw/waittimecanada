name: Production Smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional override (defaults to PRODUCTION_BASE_URL secret)"
        required: false
        type: string
concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Check Live Routes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve base URL
        id: resolve-url
        run: |
          BASE_URL="${{ github.event.inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="${{ secrets.PRODUCTION_BASE_URL }}"
          fi

          if [ -z "$BASE_URL" ]; then
            echo "Missing base URL. Provide workflow input 'base_url' or set PRODUCTION_BASE_URL secret."
            exit 1
          fi

          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Run production smoke checks
        env:
          PRODUCTION_BASE_URL: ${{ steps.resolve-url.outputs.base_url }}
        run: |
          set -o pipefail
          bash ./scripts/production-smoke.sh | tee smoke-output.txt

      - name: Write production smoke summary
        if: always()
        run: |
          {
            echo "## Production Smoke"
            echo
            echo "Base URL: ${{ steps.resolve-url.outputs.base_url }}"
            echo
            echo '```text'
            cat smoke-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
