name: Scraper CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/scraper-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.23'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --extra dev

      - name: Run Ruff linter
        working-directory: ./backend
        run: uv run ruff check src/ scripts/

      - name: Run Ruff formatter check
        working-directory: ./backend
        run: uv run ruff format --check src/ scripts/

      - name: Check migration sequence
        working-directory: ./backend
        run: uv run python scripts/check_migration_sequence.py

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --extra dev

      - name: Run mypy
        working-directory: ./backend
        run: uv run mypy src/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --extra dev

      - name: Run tests with coverage
        working-directory: ./backend
        run: |
          uv run pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: hashFiles('backend/coverage.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --extra dev

      - name: Run Bandit security scan
        working-directory: ./backend
        run: uv run bandit -r src -f json -o bandit-results.json --exit-zero

      - name: Upload Bandit report
        if: hashFiles('backend/bandit-results.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-bandit-report
          path: backend/bandit-results.json
          retention-days: 7
