name: Heartbeat Monitor (Dead Man's Switch)

# Scheduled trigger paused to conserve GitHub Actions free-tier minutes.
# Use workflow_dispatch until the scheduled cadence is restored.
on:
  workflow_dispatch:

concurrency:
  group: heartbeat-monitor
  cancel-in-progress: false

jobs:
  check-heartbeat:
    name: Check Scraper Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e .

      - name: Check heartbeats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_API_URL: ${{ secrets.ALERT_API_URL }}
          ALERT_USER_KEY: ${{ secrets.ALERT_USER_KEY }}
          ALERT_API_TOKEN: ${{ secrets.ALERT_API_TOKEN }}
        run: |
          cd backend
          python -m waittime.cli.check_heartbeat --max-age 120 --max-consecutive-failures 1
