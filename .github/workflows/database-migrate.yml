name: Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/run_migrations.py'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

concurrency:
  group: database-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          # minimal requirements for migration script: psycopg2-binary, python-dotenv
          # simpler than installing full project dependencies if we just need to run a script
          pip install psycopg2-binary python-dotenv

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python run_migrations.py

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v11
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: '[Wait Time Canada] Database Migration Failed'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Wait Time Canada Monitoring
          body: |
            Database migration failed at ${{ github.run_id }}.

            View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            CRITICAL: Manual intervention required.
