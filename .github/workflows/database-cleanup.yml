name: Database Cleanup

# Keep manual dispatch available for lightweight storage reporting and
# an operator-run retention cleanup while scheduled jobs remain paused.
on:
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: database-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e .

      - name: Run database cleanup
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.cleanup --verbose

      - name: Report measurement storage footprint
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.storage_stats --relation measurements

      - name: Report cleanup results
        if: success()
        run: |
          echo "✅ Database cleanup completed successfully"
          echo "Recent aggregates were refreshed"
          echo "Old measurements (>30 days) have been purged"
          echo "Measurement table storage stats were reported"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Database cleanup failed!"
          echo "Manual investigation required"
