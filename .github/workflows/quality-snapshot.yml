name: Daily Quality Snapshot
# PAUSED (2026-02-22): Scheduled runs disabled due to exhausted GitHub Actions quota.
# Keep manual dispatch available for one-off snapshots.
on:
  workflow_dispatch:

env:
  UV_VERSION: "0.11.23"

jobs:
  quality-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --no-dev
      - name: Run daily quality snapshot
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m waittime.cli.snapshot_quality
      - name: Run drift check
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/monitor_drift.py || true
