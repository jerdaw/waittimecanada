name: Scraper Cron Job

# Scheduled trigger paused to conserve GitHub Actions free-tier minutes.
# Use workflow_dispatch until the scheduled cadence is restored.
on:
  workflow_dispatch: # Allow manual trigger

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  run-scrapers:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        working-directory: ./backend
        run: |
          playwright install chromium

      - name: Run scrapers
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: production
        run: |
          python -m waittime.cli.scraper --all

      - name: Refresh current analytics aggregates
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.aggregate --incremental

      - name: Summarize scraper operational status
        if: always()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.check_heartbeat --max-age 120 --dry-run --verbose || true

      - name: Generate Freshness Badge
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: ./backend
        run: |
          python scripts/generate_freshness_badge.py freshness.json
          cat freshness.json

      - name: Upload Badge Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshness-badge
          path: backend/freshness.json
          retention-days: 1

      - name: Send classified scraper alerts on failure
        if: failure()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_API_URL: ${{ secrets.ALERT_API_URL }}
          ALERT_USER_KEY: ${{ secrets.ALERT_USER_KEY }}
          ALERT_API_TOKEN: ${{ secrets.ALERT_API_TOKEN }}
        run: |
          python -m waittime.cli.check_heartbeat --max-age 120 --max-consecutive-failures 1 || true
