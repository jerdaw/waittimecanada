name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

env:
  UV_VERSION: "0.11.23"
  UV_PROJECT_ENVIRONMENT: ".venv-docs"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Configure Git Credentials
        run: |
          git config user.name "Jeremy Dawson"
          git config user.email "jeremyjdawson@gmail.com"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install locked documentation dependencies
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --project backend --locked --only-group docs

      - name: Build and Deploy
        run: >-
          uv run --project backend --no-sync mkdocs gh-deploy --strict --force
          --config-file mkdocs.yml
