name: Scraper Cron Job

# Temporary cost-control throttle: run every 30 minutes.
# Review target date: 2026-03-09 (revert to */15 if Neon transfer is back within budget).
on:
  schedule:
    # Day (12:00 - 04:00 UTC): Every 30 minutes
    - cron: '*/30 12-23,0-3 * * *'
    # Night (04:00 - 12:00 UTC): Every 60 minutes
    - cron: '0 4-11 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.12'

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  run-scrapers:
    name: Run All Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        working-directory: ./backend
        run: |
          playwright install chromium

      - name: Run scrapers
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: production
        run: |
          python -m waittime.cli.scraper --all

      - name: Summarize scraper operational status
        if: always()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.check_heartbeat --max-age 90 --dry-run --verbose || true

      - name: Generate Freshness Badge
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: ./backend
        run: |
          python scripts/generate_freshness_badge.py freshness.json
          cat freshness.json

      - name: Upload Badge Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-badge
          path: backend/freshness.json
          retention-days: 1

      - name: Send classified scraper alerts on failure
        if: failure()
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          python -m waittime.cli.check_heartbeat --max-age 90 --max-consecutive-failures 1 || true
