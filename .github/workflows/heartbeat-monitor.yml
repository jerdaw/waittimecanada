name: Heartbeat Monitor (Dead Man's Switch)

# Active temporary cost-control cadence (as of 2026-03-03):
# monitor every 30 minutes with stale threshold 250 minutes.
# Review target date: 2026-03-09 (restore tighter threshold with higher scraper cadence).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: heartbeat-monitor
  cancel-in-progress: false

jobs:
  check-heartbeat:
    name: Check Scraper Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e .

      - name: Check heartbeats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          cd backend
          # Temporary cost-control throttle companion setting.
          # Review target date: 2026-03-09 (revert to --max-age 90 with */20 scraper cadence).
          python -m waittime.cli.check_heartbeat --max-age 250 --max-consecutive-failures 1
