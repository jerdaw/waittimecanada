name: Heartbeat Monitor (Dead Man's Switch)

# Check every 30 minutes if scrapers are running
on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

concurrency:
  group: heartbeat-monitor
  cancel-in-progress: false

jobs:
  check-heartbeat:
    name: Check Scraper Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e .

      - name: Check heartbeats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          cd backend
          python -m waittime.cli.check_heartbeat --max-age 60
