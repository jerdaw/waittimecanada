name: Snapshot Quality Cron

on:
  # Scheduled trigger paused to conserve GitHub Actions free-tier minutes.
  workflow_dispatch:
    # Allows manual trigger for testing or backfills

jobs:
  snapshot:
    runs-on: ubuntu-latest
    name: Run Daily Quality Snapshot

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run Snapshot Quality CLI
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -m waittime.cli.snapshot_quality --verbose
