name: Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'backend/migrations/**'
      - 'backend/run_migrations.py'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  ALERT_EMAIL_USER: ${{ secrets.ALERT_EMAIL_USER }}
  ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
  ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

concurrency:
  group: database-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python run_migrations.py

      - name: Notify on failure
        if: failure() && env.ALERT_EMAIL_TO != '' && env.ALERT_EMAIL_USER != '' && env.ALERT_EMAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@d38f3f7cd391cdebfe0d38efc3998b935e951c4f
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ env.ALERT_EMAIL_USER }}
          password: ${{ env.ALERT_EMAIL_PASSWORD }}
          subject: '[Wait Time Canada] Database Migration Failed'
          to: ${{ env.ALERT_EMAIL_TO }}
          from: Wait Time Canada Monitoring
          body: |
            Database migration failed at ${{ github.run_id }}.

            View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            CRITICAL: Manual intervention required.
