name: Snapshot Quality Cron

on:
  # Scheduled trigger paused to conserve GitHub Actions free-tier minutes.
  workflow_dispatch:
    # Allows manual trigger for testing or backfills

env:
  UV_VERSION: "0.11.23"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    name: Run Daily Quality Snapshot

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --no-dev

      - name: Run Snapshot Quality CLI
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m waittime.cli.snapshot_quality --verbose
