version: 1
repo_root: waittimecanada
services:
  - service_id: waittime-frontend
    inventory_repo: waittimecanada/frontend
    runtime: docker
    ingress: host-caddy
    canonical_host: wait-time.ca
    public_hosts:
      - wait-time.ca
    private_bind: 127.0.0.1:3400
    container_name: waittime-frontend
    systemd_unit: null
    env_file: /etc/projects-merge/env/waittime-frontend.env
    release_root: /srv/apps/waittime-frontend/releases
    health:
      public:
        url: https://wait-time.ca/api/health
        kind: json
        expect_status:
          - 200
      private:
        url: http://127.0.0.1:3400/api/health
        kind: json
        expect_status:
          - 200
    boundary_entrypoints:
      - docs/operations/direct-vps-frontend.md
