services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: waittimecanada_test
      POSTGRES_USER: waittime
      POSTGRES_PASSWORD: waittime # pragma: allowlist secret
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waittime -d waittimecanada_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
