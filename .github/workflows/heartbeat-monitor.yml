name: Heartbeat Monitor (Dead Man's Switch)

# Active production cadence:
# monitor every 30 minutes with stale threshold 120 minutes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: heartbeat-monitor
  cancel-in-progress: false

jobs:
  check-heartbeat:
    name: Check Scraper Health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e .

      - name: Check heartbeats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          cd backend
          python -m waittime.cli.check_heartbeat --max-age 120 --max-consecutive-failures 1
