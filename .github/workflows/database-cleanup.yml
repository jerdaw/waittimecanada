name: Database Cleanup

# PAUSED (2026-02-22): Scheduled runs disabled due to exhausted GitHub Actions quota.
# Keep manual dispatch available if a retention cleanup is needed before quota reset.
on:
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: database-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e .

      - name: Run database cleanup
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m waittime.cli.cleanup --verbose

      - name: Report cleanup results
        if: success()
        run: |
          echo "✅ Database cleanup completed successfully"
          echo "Old measurements (>30 days) have been purged"
          echo "This maintains our storage safety policy"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Database cleanup failed!"
          echo "Manual investigation required"
