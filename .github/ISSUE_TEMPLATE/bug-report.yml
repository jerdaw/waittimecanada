name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide details to help us fix it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What's the bug? What did you expect to happen?
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Frontend (UI/Map/Pages)
        - Backend (Scrapers)
        - API (Endpoints)
        - Database (Data integrity)
        - Documentation
        - CI/CD (GitHub Actions)
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this issue?
      options:
        - Critical (System down, data loss)
        - High (Major functionality broken)
        - Medium (Feature impaired, workaround exists)
        - Low (Minor issue, cosmetic)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did you encounter this bug?
      placeholder: |
        - Browser: Chrome 120, Safari 17, etc.
        - OS: macOS, Windows, Linux, etc.
        - URL: https://...
        - Timestamp: 2026-02-13 10:30 AM EST
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Console Output
      description: Any error messages, stack traces, or console logs?
      placeholder: Paste error logs here...
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      description: Drag and drop screenshots if helpful
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Clinical/Research Impact (Optional)
      description: Does this affect data accuracy or clinical defensibility?
      options:
        - Yes - Methodology comparison affected
        - Yes - Wait time data incorrect
        - Yes - Data quality metrics wrong
        - No - UI/UX issue only
        - Not applicable
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm you've checked these
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I provided clear steps to reproduce
          required: true
        - label: This is a bug report (not a feature request or data quality issue)
          required: true
