name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Extract Release Notes
        id: extract-notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Extracting notes for version: $VERSION"

          # Extract the section from CHANGELOG.md corresponding to this version
          # It looks for `## [VERSION]` and grabs everything until the next `## [`
          awk -v ver="$VERSION" '
            /^## \[.*\]/ {
              if (match($0, "## \\[" ver "\\]")) {
                capture = 1
                next
              } else if (capture) {
                exit
              }
            }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          # If the file is empty (e.g., tag without changelog entry), provide a default
          if [ ! -s release-notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
